name: .NET

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.100
        
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Log Current Directory
      run: |
        echo "Current Directory:"
        pwd
       
    - name: Restore dependencies
      run: dotnet restore ./Src/SafetySystems.slnx
      
    - name: Build
      run: dotnet build ./Src/SafetySystems.slnx --no-restore
      
    - name: Test
      run: dotnet test ./Src/SafetySystems.slnx --no-build --verbosity normal
